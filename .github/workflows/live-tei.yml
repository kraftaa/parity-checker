name: live TEI parity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  minilm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_ID: sentence-transformers/all-MiniLM-L6-v2
      MODEL_REVISION: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[sentence-transformers,test]'
      - name: Start pinned TEI
        run: |
          docker run --detach --name tei --publish 8080:80 \
            ghcr.io/huggingface/text-embeddings-inference:cpu-1.9 \
            --model-id "$MODEL_ID" --revision "$MODEL_REVISION"
      - name: Wait for TEI
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs tei
          exit 1
      - name: Compare pinned runtimes
        run: |
          embed-parity compare \
            --model "$MODEL_ID" \
            --revision "$MODEL_REVISION" \
            --tei http://127.0.0.1:8080 \
            --device cpu \
            --batch-sizes 1,8,32 \
            --json live-minilm.json
      - if: always()
        run: docker logs tei > tei.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-minilm-parity
          path: |
            live-minilm.json
            tei.log
          if-no-files-found: warn
