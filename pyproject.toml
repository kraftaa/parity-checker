[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "embed-parity"
version = "0.1.0"
description = "Compare SentenceTransformers embeddings with a TEI deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "httpx>=0.25",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=2.6"]
test = ["pytest>=8"]

[project.scripts]
embed-parity = "embed_parity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["embed_parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires a live TEI server and downloaded model"]
