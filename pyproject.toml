[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "embed-parity"
version = "0.4.0"
description = "Measure embedding and retrieval parity between SentenceTransformers and TEI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.24",
  "httpx>=0.25",
]

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=2.6"]
test = ["pytest>=8"]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.scripts]
embed-parity = "embed_parity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["embed_parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires a live TEI server and downloaded model"]

[tool.coverage.run]
branch = true
source = ["embed_parity"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
